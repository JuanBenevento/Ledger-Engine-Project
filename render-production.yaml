##############################################################################
# Render — PRODUCTION Backend Service
# Ledger Engine Platform (Billetera Virtual)
#
# Service: ledger-engine-api
# Branch: main
# Runtime: Docker
##############################################################################

services:
  - type: web
    name: ledger-engine-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    port: 8080
    plan: free
    autoDeploy: true
    branch: main

    # Health check
    healthCheckPath: /actuator/health

    # Environment variables
    envVars:
      # Spring Profile
      - key: SPRING_PROFILES_ACTIVE
        value: production

      # Database (Supabase — Production)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Redis (Render Redis or external)
      - key: SPRING_DATA_REDIS_HOST
        sync: false
      - key: SPRING_DATA_REDIS_PORT
        value: 6379
      - key: SPRING_DATA_REDIS_PASSWORD
        sync: false

      # RabbitMQ (CloudAMQP or external)
      - key: SPRING_RABBITMQ_HOST
        sync: false
      - key: SPRING_RABBITMQ_PORT
        value: 5672
      - key: SPRING_RABBITMQ_USERNAME
        sync: false
      - key: SPRING_RABBITMQ_PASSWORD
        sync: false

      # Keycloak (Self-hosted on Render — Production)
      - key: KEYCLOAK_ISSUER_URI
        sync: false
      - key: KEYCLOAK_JWK_SET_URI
        sync: false

      # CORS (Vercel Production Domain)
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # Actuator (minimal for production)
      - key: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
        value: health,info
      - key: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
        value: when_authorized

      # Logging (minimal for production)
      - key: LOGGING_LEVEL_COM_JUANBENEVENTO_LEDGER
        value: INFO
      - key: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY
        value: WARN

      # JVM Options
      - key: JAVA_OPTS
        value: -Xms256m -Xmx512m

    # Pre-deploy command (runs migrations if needed)
    preDeployCommand: echo "Production deploy starting..."
