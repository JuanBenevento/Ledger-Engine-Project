##############################################################################
# GitHub Actions — CI/CD for Ledger Engine
#
# This workflow:
# - Runs tests on every push/PR
# - Deploys to STAGING on push to any branch (PR preview)
# - Deploys to PRODUCTION on push to main
##############################################################################

name: CI/CD Pipeline

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # =========================================================================
  # TEST JOB — Runs on every push and PR
  # =========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: maven

      - name: Run tests
        run: mvn clean test -B

      - name: Generate test report
        if: always()
        run: mvn surefire-report:report -B
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: target/surefire-reports/
          retention-days: 7

  # =========================================================================
  # BUILD JOB — Builds the Docker image
  # =========================================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: ledger-engine-api/target/*.jar
          retention-days: 1

  # =========================================================================
  # DEPLOY BACKEND STAGING — Deploys backend to Render on branch push
  # =========================================================================
  deploy-backend-staging:
    name: Deploy Backend (Staging)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render (Staging)
        run: |
          echo "Triggering Render deploy for staging..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_STAGING_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Deploy triggered successfully"
            echo "Deploy ID: $(echo $BODY | jq -r '.id')"
          else
            echo "❌ Deploy failed (HTTP $HTTP_CODE)"
            echo "$BODY" | jq . || echo "$BODY"
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Backend Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: https://ledger-engine-api-staging.onrender.com" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # DEPLOY FRONTEND STAGING — Deploys frontend to Vercel (Preview)
  # (requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets)
  # =========================================================================
  deploy-frontend-staging:
    name: Deploy Frontend (Staging)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref != 'refs/heads/main' && github.event_name == 'push' && secrets.VERCEL_TOKEN != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel project
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Preview)
        id: vercel-deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Summary
        run: |
          echo "## Frontend Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: ${{ steps.vercel-deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # DEPLOY BACKEND PRODUCTION — Deploys backend to Render on main push
  # =========================================================================
  deploy-backend-production:
    name: Deploy Backend (Production)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy to Render (Production)
        run: |
          echo "Triggering Render deploy for production..."
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_PRODUCTION_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          if [ "$HTTP_CODE" = "201" ]; then
            echo "✅ Deploy triggered successfully"
            echo "Deploy ID: $(echo $BODY | jq -r '.id')"
          else
            echo "❌ Deploy failed (HTTP $HTTP_CODE)"
            echo "$BODY" | jq . || echo "$BODY"
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Backend Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: https://ledger-engine-api.onrender.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Keycloak**: https://lemur-16.cloud-iam.com/auth" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # DEPLOY FRONTEND PRODUCTION — Deploys frontend to Vercel on main push
  # (requires VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID secrets)
  # =========================================================================
  deploy-frontend-production:
    name: Deploy Frontend (Production)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && secrets.VERCEL_TOKEN != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Vercel project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (Production)
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Summary
        run: |
          echo "## Frontend Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Frontend**: https://ledger-engine.vercel.app" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # SMOKE TEST — Runs after backend production deployment
  # =========================================================================
  smoke-test:
    name: Production Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-backend-production
    if: always() && needs.deploy-backend-production.result == 'success'

    steps:
      - name: Wait for services to stabilize
        run: sleep 30

      - name: Check backend health
        run: |
          echo "Checking production backend health..."
          for i in {1..5}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://ledger-engine-api.onrender.com/actuator/health)
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Backend is healthy"
              exit 0
            fi
            echo "⏳ Attempt $i: Backend returned $RESPONSE, waiting..."
            sleep 10
          done
          echo "❌ Backend health check failed"
          exit 1

      - name: Check Keycloak health
        run: |
          echo "Checking Cloud-IAM Keycloak health..."
          for i in {1..5}; do
            RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://lemur-16.cloud-iam.com/auth/realms/ledger-engine/.well-known/openid-configuration)
            if [ "$RESPONSE" = "200" ]; then
              echo "✅ Keycloak is healthy"
              exit 0
            fi
            echo "⏳ Attempt $i: Keycloak returned $RESPONSE, waiting..."
            sleep 10
          done
          echo "❌ Keycloak health check failed"
          exit 1

      - name: Check frontend
        run: |
          echo "Checking production frontend..."
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" https://ledger-engine.vercel.app)
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Frontend is accessible"
          else
            echo "⚠️ Frontend returned $RESPONSE"
          fi

      - name: Smoke test summary
        run: |
          echo "## Smoke Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All production services are healthy and accessible." >> $GITHUB_STEP_SUMMARY
