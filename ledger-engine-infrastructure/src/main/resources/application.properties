spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hibernate ddl-auto: validate ensures Flyway manages schema
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security configuration
ledger.security.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/auth/realms/ledger}
ledger.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
ledger.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
ledger.security.cors.allowed-headers=*

# SpringDoc / Swagger UI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.packages-to-scan=com.juanbenevento.ledger.*.infrastructure.adapter.in.rest.controller

# Actuator configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true
management.health.diskspace.enabled=true
management.health.db.enabled=true
management.health.redis.enabled=true

# Micrometer metrics
management.metrics.export.prometheus.enabled=true
management.metrics.export.prometheus.step=1m
management.metrics.tags.application=ledger-engine
