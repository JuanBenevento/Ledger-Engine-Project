spring.datasource.url=jdbc:postgresql://localhost:5432/ledger_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Hibernate ddl-auto: validate ensures Flyway manages schema
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Security configuration
ledger.security.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/auth/realms/ledger}
ledger.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
ledger.security.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
ledger.security.cors.allowed-headers=*
